<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="자격증별 기출문제와 학습 콘텐츠를 제공하는 Gisaclub 온라인 학습 서비스입니다.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Gisaclub">
  <meta name="theme-color" content="#4F46E5">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Gisaclub - 자격증 온라인 학습</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* 초기 로딩 시 흰 화면 깜빡임 방지: 브랜드 배경 + 중앙 로더 */
    html, body {
      background: #4F46E5;
      margin: 0;
      height: 100%;
    }
    #app-boot-loader {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #4F46E5;
      z-index: 9999;
      transition: opacity 0.35s ease;
    }
    #app-boot-loader.hide {
      opacity: 0;
      pointer-events: none;
    }
    #app-boot-loader .spinner {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 4px solid rgba(255,255,255,0.25);
      border-top-color: #ffffff;
      animation: app-boot-spin 0.8s linear infinite;
    }
    @keyframes app-boot-spin {
      to { transform: rotate(360deg); }
    }
  </style>
  <script>
    // 구버전 서비스워커·캐시 강제 제거 — 항상 최신 빌드 로드 보장
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(rs) {
        rs.forEach(function(r) { r.unregister(); });
      });
    }
    if (window.caches) {
      caches.keys().then(function(keys) {
        keys.forEach(function(k) { caches.delete(k); });
      });
    }
  </script>
</head>
<body>
  <div id="app-boot-loader"><div class="spinner"></div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('app-boot-loader');
      if (el) {
        el.classList.add('hide');
        setTimeout(function () { el.remove(); }, 400);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
