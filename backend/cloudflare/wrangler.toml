name = "gisaclub-api"
main = "src/index.js"
compatibility_date = "2024-09-01"
# 배포 시 Worker는 기본으로 https://gisaclub-api.<your-subdomain>.workers.dev 에서 서비스된다.
# 커스텀 도메인을 구매하기 전까지는 이 workers.dev 주소를 그대로 사용한다(도메인 비종속 · R58).
# 앱/대시보드에는 이 주소를 하드코딩하지 않고 API_BASE_URL / GISACLUB_CONFIG.apiBase 로만 주입한다.
#
# [커스텀 도메인 구매 후에만] 아래 route 주석을 해제하고 값을 채운다:
# routes = [ { pattern = "api.gisa.club/*", zone_name = "gisa.club" } ]

# D1 (SQL 데이터베이스)
[[d1_databases]]
binding = "DB"
database_name = "gisaclub-db"
database_id = "c318d6c4-7e9f-496b-b0b9-cf86f27f0b94"
migrations_dir = "migrations"

# Global service kill switch — one strongly consistent Durable Object instance.
[[durable_objects.bindings]]
name = "SERVICE_CONTROL"
class_name = "ServiceControl"

[[migrations]]
tag = "service-control-v1"
new_sqlite_classes = ["ServiceControl"]

# R2 (콘텐츠 스토리지 — 문제/해설/이미지)
[[r2_buckets]]
binding = "CONTENT"
bucket_name = "gisaclub-content"

# Server-side draft generation: 08:00 KST == 23:00 UTC on the previous day.
[triggers]
crons = ["0 23 * * *"]

# KV (세션/레이트리밋 캐시)
[[kv_namespaces]]
binding = "SESSIONS"
id = "a05c2eaa166941a1935139756388d346"

# KV (앱 설정 — 버전 매니페스트 app_version_manifest 저장)
[[kv_namespaces]]
binding = "SETTINGS"
id = "10f87e5a83104cb78b87ef9f6a6b2d1e"

# 비밀값은 `wrangler secret put`으로 주입:
#   JWT_SIGNING_KEY, CEREBRAS_API_KEY, GOOGLE_PLAY_SA_JSON
#   ADMIN_TOKEN_SECRET  ← 앱 관리자 토큰 HMAC 서명 키(R57)
[vars]
GOOGLE_OAUTH_CLIENT_ID = "REPLACE_WITH_GOOGLE_WEB_CLIENT_ID"
GOOGLE_OAUTH_ANDROID_CLIENT_IDS = ""
KAKAO_APP_ID = "1625637"
FREE_QUESTION_RATIO = "0.10"
FREE_AI_DAILY_LIMIT = "5"
FREE_AI_MAX_TOKENS = "400"
PREMIUM_AI_MAX_TOKENS = "2048"
AI_MODEL = "gpt-oss-120b"
AI_ENDPOINT = "https://api.cerebras.ai/v1/chat/completions"
BLOG_DRAFTS_ENABLED = "true"

# ── Cloudflare Access(Zero Trust) 관리자 인증 설정(R57/R58) ──
# ACCESS_TEAM_DOMAIN: Zero Trust 팀 도메인 (예: <team>.cloudflareaccess.com)
# ACCESS_AUD: 관리자 대시보드(Pages, 기본 *.pages.dev) Access Application의
#             Application Audience(AUD) 태그
# ADMIN_ALLOWED_EMAILS: 허용 운영자 이메일(쉼표구분, 이중방어)
ACCESS_TEAM_DOMAIN = "REPLACE_WITH_TEAM.cloudflareaccess.com"
ACCESS_AUD = "REPLACE_WITH_ACCESS_APPLICATION_AUD"
ADMIN_ALLOWED_EMAILS = "designssir@gmail.com"
