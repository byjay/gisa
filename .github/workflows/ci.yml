name: CI

# Q39 CI/CD 파이프라인 — 푸시/PR 시 analyze · test · build 자동 검증
# Flutter 3.35.4 / Dart 3.9.2 버전 고정(MASTER_PLAN §3 HARD RULE 3)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: Analyze · Test · Build Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze (0 issue required)
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter expanded

      - name: Build web (release)
        run: flutter build web --release

  build-apk:
    name: Build Android APK (release)
    runs-on: ubuntu-latest
    # main 브랜치 푸시에서만 APK 산출(PR에서는 생략해 시간 절약)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.35.4
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gisaclub-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
